<!doctype html>
<html><head><meta charset="utf-8"><title>EDITOR-MONACO loading</title>
<style>body{margin:0}#ed{height:100vh}</style></head>
<body><div id="ed"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<script>
// Monaco (ядро VS Code; используется в Colab) с настройками по умолчанию
require.config({paths: {vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"}});
require(["vs/editor/editor.main"], function () {
  const lang = location.hash === "#js" ? "javascript" : "python";
  const ed = monaco.editor.create(document.getElementById("ed"), {value: "", language: lang, theme: "vs-dark"});
  let timer = null;
  ed.onDidChangeModelContent(() => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      document.title = "RESULT:" + btoa(unescape(encodeURIComponent(ed.getValue())));
    }, 2500);
  });
  ed.focus();
  document.title = "EDITOR-MONACO ready";
});
</script></body></html>
